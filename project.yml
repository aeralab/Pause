name: Stop
options:
  bundleIdPrefix: com.onepersoncompany
  deploymentTarget:
    iOS: "17.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  Stop:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onepersoncompany.stop
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pause
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: Stop.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: StopMonitor
        embed: true
      - target: StopShield
        embed: true
      - target: StopShieldAction
        embed: true
  StopMonitor:
    type: app-extension
    platform: iOS
    sources: [Monitor, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onepersoncompany.stop.monitor
        INFOPLIST_FILE: Monitor/Info.plist
        CODE_SIGN_ENTITLEMENTS: Stop.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
  StopShield:
    type: app-extension
    platform: iOS
    sources: [Shield, Shared/Rules.swift, Shared/Repository.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onepersoncompany.stop.shield
        INFOPLIST_FILE: Shield/Info.plist
        CODE_SIGN_ENTITLEMENTS: Stop.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
  StopShieldAction:
    type: app-extension
    platform: iOS
    sources: [ShieldAction]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onepersoncompany.stop.shieldaction
        INFOPLIST_FILE: ShieldAction/Info.plist
        CODE_SIGN_ENTITLEMENTS: Stop.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
  StopTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests, Shared/Rules.swift]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Stop:
    build:
      targets:
        Stop: all
    test:
      targets: [StopTests]
